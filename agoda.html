    <title>First Page</title>
    <link ref="stylesheet"href="index.css">
    <style>
        body{
            background-color:white;
        }
        img{
            width: 100%;
            height: 500px;
            border-radius: 50px;
            margin-left: 0px;
            align-items: center;
            justify-content: center;
            display: flex;
        }
        h1{
            font-size: 30px;
            text-align: center;
            color: rgb(99, 199, 139);
        }
        h6{
            font-size: 30px;
            
            text-align: center;
            color: rgb(20, 220, 53);
        }
        .Sub{
            transition: all 1s ease;
            
            width: 200px;
            text-align: center;
            align-items: center;
            border-radius: 30px;
            color: rgb(8, 113, 64);
        }
        .Sub img{
            width: 300px;
            height: 200px;
            border-radius: 20px;
            display: block;
            margin: 0 auto;
            width: 90%;
        }
        .Sub button{
            transition: all 1s ease;
            width: 10vw;
            background-color:rgb(8, 8, 8);
            color: rgb(250, 247, 247);
            border-radius: 50px;
            justify-content: center;
            display: block;
            margin: 0 auto;
            margin-top: 10px;
        }
        .Main{
            
            display: flex;
            justify-content: space-evenly;
        }
        .Main:hover .Sub{
            
            transform: scale(0.8);
            color: rgb(223, 133, 133);
        }
        .Main.Sub:hover{
            transform: scale(1.0);
            
            color: rgb(230, 119, 119);
        }
        
    </style>
</head>
